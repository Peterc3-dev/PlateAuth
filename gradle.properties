android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
kotlin.code.style=official
# AGP 8.2.0 was tested up to compileSdk 34; we build against 35 (the installed/
# current stable platform). The API surface used by the app is unchanged, so the
# "untested compileSdk" warning is suppressed rather than reverting the platform.
android.suppressUnsupportedCompileSdk=35
